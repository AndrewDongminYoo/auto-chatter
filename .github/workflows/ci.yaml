name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-dev
          POSTGRES_DB: automations_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d automations_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check-types
      - run: corepack pnpm test
      - run: corepack pnpm test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:local-dev@127.0.0.1:5433/automations_test
      - run: corepack pnpm test:cloudflare
        env:
          TEST_DATABASE_URL: postgres://postgres:local-dev@127.0.0.1:5433/automations_test
          WRANGLER_SEND_METRICS: "false"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          check-mode: all
          arguments: --no-fix

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-deployment
      APP_IMAGE_TAG: ci
      POSTGRES_PASSWORD: ci-admin-password
      APP_DB_PASSWORD: ci-app-password
      INSTAGRAM_APP_SECRET: ci-app-secret
      INSTAGRAM_VERIFY_TOKEN: ci-verify-token
      WEBHOOK_DOMAIN: localhost
      PROXY_BIND: 127.0.0.1
      HTTP_PORT: "19080"
      HTTPS_PORT: "19443"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate and build
        run: |
          docker compose --env-file /dev/null config --quiet
          sh -n deploy/init-app-user.sh
          docker compose --env-file /dev/null build ingress
      - name: Start DB and ingress without a send worker
        run: |
          docker compose --env-file /dev/null up -d --wait db ingress
          test -z "$(docker compose --env-file /dev/null --profile send ps -q worker)"
      - name: Verify signed event persistence and replay protection
        run: |
          docker compose --env-file /dev/null exec -T ingress node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHmac } from 'node:crypto';
          import { Pool } from 'pg';
          assert.notEqual(process.getuid(), 0);
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await pool.query("INSERT INTO workspaces VALUES ('11111111-1111-4111-8111-111111111111')");
            await pool.query("INSERT INTO instagram_connections(id,workspace_id,account_id,active) VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','ci-account',true)");
            await pool.query("INSERT INTO instagram_comment_rules(id,workspace_id,connection_id,media_id,keyword,private_reply_text,enabled) VALUES ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222','ci-media','hello','test reply',true)");
            const body = JSON.stringify({object:'instagram',entry:[{id:'ci-account',field:'comments',value:{id:'ci-comment',text:'hello',from:{id:'ci-sender'},media:{id:'ci-media'}}}]});
            const send = signature => fetch('http://127.0.0.1:3000/webhooks/instagram', {method:'POST',body,headers:{'x-hub-signature-256':signature}});
            assert.equal((await send('sha256='+'0'.repeat(64))).status, 403);
            assert.equal((await pool.query('SELECT count(*) FROM private_reply_outbox')).rows[0].count, '0');
            const signature = 'sha256='+createHmac('sha256',process.env.INSTAGRAM_APP_SECRET).update(body).digest('hex');
            assert.equal((await send(signature)).status, 200);
            assert.equal((await send(signature)).status, 200);
            assert.deepEqual((await pool.query('SELECT status,count(*) FROM private_reply_outbox GROUP BY status')).rows,[{status:'pending',count:'1'}]);
            await assert.rejects(pool.query('DELETE FROM private_reply_outbox'), {code:'42501'});
            await assert.rejects(pool.query('CREATE TABLE forbidden(id int)'), {code:'42501'});
          } finally { await pool.end(); }
          JS
      - name: Verify local HTTPS proxy
        run: |
          docker compose --env-file /dev/null --profile public up -d proxy
          for attempt in $(seq 1 30); do
            if docker compose --env-file /dev/null cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/caddy-root.crt; then break; fi
            sleep 1
          done
          curl --fail --retry 5 --retry-connrefused --cacert /tmp/caddy-root.crt 'https://localhost:19443/webhooks/instagram?hub.mode=subscribe&hub.verify_token=ci-verify-token&hub.challenge=ci-challenge' > /tmp/challenge.txt
          test "$(cat /tmp/challenge.txt)" = ci-challenge
      - name: Show failure logs
        if: failure()
        run: docker compose --env-file /dev/null --profile public logs --tail 100
      - name: Remove disposable CI resources
        if: always()
        run: docker compose --env-file /dev/null --profile public --profile send down --volumes
