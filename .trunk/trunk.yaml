# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - python@3.14.4
    - node@24.20.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - bandit
    # trufflehog owns secret scanning; checkov only flagged the synthetic CI credentials and a missing HEALTHCHECK.
    - checkov
    - grype
    # ruff's I rules sort the imports.
    - isort
  definitions:
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
          sandbox_type: copy_targets
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
  enabled:
    - actionlint@1.7.8
    - black@26.10.1
    - cspell@10.4.0
    - git-diff-check
    - hadolint@2.15.1
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - oxipng@9.1.5
    - pinact@4.1.1!
    - prettier@3.9.10
    - ruff@0.17.3
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - taplo@0.10.0
    - trufflehog@3.99.7
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-upgrade-available
    - trunk-announce
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
