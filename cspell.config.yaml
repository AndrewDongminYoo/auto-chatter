version: "0.2"
useGitignore: true
# Read only this repository's .gitignore files, never the home-directory repository above it.
gitignoreRoot: .
# Tracked dot-paths (.github/, .trunk/, .env.example, ...) carry prose and code.
enableGlobDot: true
ignorePaths:
  # Per-user Claude Code settings, excluded by the global gitignore that cspell does not read; never committed.
  - .claude/settings.local.json
  # Required while enableGlobDot is on: the git database is not prose.
  - .git
  # Generated by pnpm: package names and platform triples, not prose.
  - pnpm-lock.yaml
ignoreRegExpList:
  # GitHub advisory IDs (GHSA-xxxx-xxxx-xxxx) are random four-character groups.
  - /\bGHSA(?:-[0-9a-z]{4}){3}\b/gi
dictionaryDefinitions:
  - name: custom-dictionary
    path: ./.cspell/custom-dictionary.txt
    addWords: true
  - name: postgres-terms
    path: ./.cspell/postgres-terms.txt
    addWords: false
dictionaries:
  - bash
  - custom-dictionary
  - docker
  - html
  - node
  - npm
  - postgres-terms
  - python
  - sql
  - typescript
